name: Build package
on:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.published.outputs.exists }}
    steps:
    - uses: actions/checkout@v6
    - name: Read DVC version
      run: echo "DVC_VERSION=$(grep -oP 'VERSION\s*=\s*\"\K[^\"]+' download.py)" >> "$GITHUB_ENV"
    - name: Check if version already published
      id: published
      run: |
        code=$(curl -sI -o /dev/null -w '%{http_code}' "https://downloads.dvc.org/osxpkg/dvc-${DVC_VERSION}.pkg")
        if [ "$code" = "200" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        elif [ "$code" = "403" ]; then
          echo "exists=false" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Unexpected status $code checking downloads.dvc.org"
          exit 1
        fi

  binary:
    environment: apple-signing
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Install app certificates
      env:
        ITERATIVE_APPLICATION_CERT: ${{ secrets.ITERATIVE_APPLICATION_CERT_2031 }}
        ITERATIVE_APPLICATION_CERT_PASS: ${{ secrets.ITERATIVE_APPLICATION_CERT_PASS_2031 }}
      run: |
        echo $ITERATIVE_APPLICATION_CERT | base64 -d > application_cert.p12
        security create-keychain -p 123456 build.keychain
        # NOTE: signing and steps before it might take longer than default 300 seconds, so we extend the
        # timeout until the keychain automatically locks again.
        security set-keychain-settings -lut 3600 build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p 123456 build.keychain
        security import application_cert.p12 -k build.keychain -P $ITERATIVE_APPLICATION_CERT_PASS -T /usr/bin/codesign
        security set-key-partition-list -S 'apple-tool:,apple:,codesign:,productsign:' -s -k 123456 build.keychain
        security find-identity -v

    - name: Install requirements
      run: uv pip install -r requirements.txt --system

    - name: Download dvc pkg
      run: python download.py

    - name: Set pkg type
      run: echo 'PKG = "osxpkg"' > dvc/dvc/_build.py

    - name: Install dvc requirements
      run: |
        uv pip install ./dvc[all] -r ./build-requirements.txt --system
        dvc doctor

    - name: Build binary
      run: python build_bin.py

    - name: Sign binary
      run: python sign_bin.py --application-id 19829808068B6970345E043F20EC84C961848658 --keychain build.keychain

    - name: Create tar with binary files
      run: tar cvf dist.tar.gz dist

    - name: Upload binary to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: binary
        path: dist.tar.gz
        retention-days: 1

  installer:
    needs: binary
    environment: apple-signing
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Set up Ruby 2.6
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.6

    - name: Install installer certificates
      env:
        ITERATIVE_INSTALLER_CERT: ${{ secrets.ITERATIVE_INSTALLER_CERT_2031 }}
        ITERATIVE_INSTALLER_CERT_PASS: ${{ secrets.ITERATIVE_INSTALLER_CERT_PASS_2031 }}
      run: |
        echo $ITERATIVE_INSTALLER_CERT | base64 -d > installer_cert.p12
        security create-keychain -p 123456 build.keychain
        # NOTE: signing and steps before it might take longer than default 300 seconds, so we extend the
        # timeout until the keychain automatically locks again.
        security set-keychain-settings -lut 3600 build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p 123456 build.keychain
        security import installer_cert.p12 -k build.keychain -P $ITERATIVE_INSTALLER_CERT_PASS -T /usr/bin/productsign
        security set-key-partition-list -S 'apple-tool:,apple:,codesign:,productsign:' -s -k 123456 build.keychain

    - name: Check certificates
      run: security find-identity -v

    - name: Install requirements
      run: |
        uv pip install -r requirements.txt --system
        gem install --no-document dotenv:2.8.1 fpm:1.17.0

    - name: Download signed binary
      uses: actions/download-artifact@v6
      with:
        name: binary

    - name: Unpack tar with binary files
      run: tar -xvf dist.tar.gz

    - name: Build installer
      run: python build_installer.py

    - name: Sign installer
      run: python sign_installer.py --installer-id 7FAFECBEEAA60C248558144EB1DAE0C95BAAD171 --keychain build.keychain

    - name: Upload installer to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: installer
        path: dvc*.pkg
        retention-days: 1

  notarize:
    needs: installer
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install requirements
      run: |
        brew install Bearer/tap/gon

    - name: Download signed installer
      uses: actions/download-artifact@v6
      with:
        name: installer

    - name: Notarize and staple installer
      env:
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_ID_PROVIDER: ${{ secrets.APPLE_ID_PROVIDER }}
      run: python notarize_installer.py --apple-id-username ivan@iterative.ai --apple-id-password $APPLE_ID_PASSWORD --apple-id-provider $APPLE_ID_PROVIDER

    - name: Upload stapled installer to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: stapled_installer
        path: dvc*.pkg
        retention-days: 1

  upload:
    needs: [check, notarize]
    if: ${{ needs.check.outputs.published != 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: aws
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install requirements
      run: pip install awscli

    - name: Download signed, notarized and stapled installer
      uses: actions/download-artifact@v6
      with:
        name: stapled_installer

    - uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-region: us-east-2
        role-to-assume: arn:aws:iam::977611293394:role/dvc-public-osxpkg-deployer
    - name: Upload to aws
      run: python upload.py dvc-*.pkg s3://dvc-packages/osxpkg/

  notify:
    if: github.ref == 'refs/heads/main' && failure()
    needs: [check, binary, installer, notarize, upload]
    runs-on: ubuntu-latest
    steps:
    - name: Slack Notification
      uses: rtCamp/action-slack-notify@v2.3.3
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_COLOR: ${{ job.status }}
        SLACK_MESSAGE: 'Package build failed for ${{ github.repository }}'
        SLACK_TITLE: CI Status
        SLACK_USERNAME: dvc-pkg-build
